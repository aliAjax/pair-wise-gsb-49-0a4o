<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>再保险合约与巨灾暴露管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.2rem; }
    th, td { border: 1px solid #d5dde5; padding: .4rem .6rem; text-align: left; font-size: .92rem; }
    th { background: #eef2f6; }
    .cards { display: flex; gap: 1rem; flex-wrap: wrap; margin: .8rem 0; }
    .card { background: #f4f6f8; border-radius: 8px; padding: .7rem 1.1rem; min-width: 8.5rem; }
    .card .label { font-size: .8rem; color: #5a6a7a; }
    .card .num { font-size: 1.1rem; font-weight: 600; }
    .error { background: #fdecea; border: 1px solid #f5c6c0; padding: .8rem 1rem; border-radius: 8px; margin-top: .8rem; }
    .ok { background: #e8f5e9; border: 1px solid #bfe3c4; padding: .8rem 1rem; border-radius: 8px; margin-top: .8rem; }
    input, select { padding: .45rem .5rem; }
    label { display: flex; flex-direction: column; font-size: .85rem; gap: .2rem; }
  </style>
</head>
<body>
<main>
  <h1>再保险合约与巨灾暴露管理</h1>
  <div class="row"><button id="load">加载记录</button><button id="stats">查看状态统计</button></div>
  <pre id="output">点击上方按钮读取服务状态。</pre>

  <h2>合约台账</h2>
  <div class="row">
    <label>合约<select id="contract"></select></label>
    <button id="loadLedger">查看台账</button>
  </div>
  <div id="ledger"></div>

  <h2>登记批单</h2>
  <form id="endorseForm" class="row">
    <label>生效日<input type="date" id="effDate" required></label>
    <label>方向<select id="direction"><option value="increase">加保</option><option value="decrease">减保</option></select></label>
    <label>金额<input type="number" id="amount" min="0.01" step="0.01" required></label>
    <label>经办原因<input type="text" id="reason" required></label>
    <button type="submit">提交批单</button>
  </form>
  <div id="endorseResult"></div>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
const fmt = n => Number(n).toLocaleString("zh-CN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const dirLabel = d => d === "increase" ? "加保" : "减保";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");

function table(head, rows) {
  if (!rows.length) return "<p>暂无数据。</p>";
  return "<table><tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</table>";
}

function occupancyRows(items) {
  return items.map(o => [esc(o.label), esc(o.claim_number || "-"), esc(o.state || "-"), fmt(o.amount)]);
}

async function loadContracts() {
  const response = await fetch("/api/records?limit=100", {headers});
  const data = await response.json();
  const select = document.getElementById("contract");
  select.innerHTML = "";
  for (const r of data.items) {
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = `#${r.id} ${r.reference}（${r.state}）`;
    select.appendChild(opt);
  }
  if (data.items.length) loadLedger();
}

async function loadLedger() {
  const id = document.getElementById("contract").value;
  if (!id) return;
  const response = await fetch(`/api/records/${id}/ledger`, {headers});
  const data = await response.json();
  if (!response.ok) {
    document.getElementById("ledger").innerHTML = `<div class="error">${esc(data.message)}</div>`;
    return;
  }
  const cards = [["当前限额", data.current_limit], ["摊回容量", data.capacity], ["已用", data.used], ["剩余", data.remaining]]
    .map(([label, value]) => `<div class="card"><div class="label">${label}</div><div class="num">${fmt(value)}</div></div>`).join("");
  const endorsements = data.endorsements.map(e =>
    [esc(e.effective_date), dirLabel(e.direction), fmt(e.amount), esc(e.reason), fmt(e.resulting_limit), esc(e.created_by), esc(e.created_at)]);
  const snapshots = data.snapshots.map(s =>
    [esc(s.created_at), `#${s.endorsement_id}`, fmt(s.current_limit), fmt(s.capacity), fmt(s.used_amount), fmt(s.remaining_amount)]);
  document.getElementById("ledger").innerHTML =
    `<p>合约 <b>${esc(data.reference)}</b>（${esc(data.state)}）　基础限额 ${fmt(data.base_limit)}　起赔点 ${fmt(data.attachment)}　分保比例 ${data.cession_pct}</p>` +
    `<div class="cards">${cards}</div>` +
    `<h3>占用明细</h3>` + table(["类型", "赔案号", "状态", "金额"], occupancyRows(data.occupancy)) +
    `<h3>批单历史（按生效先后）</h3>` + table(["生效日", "方向", "金额", "经办原因", "变更后限额", "经办人", "登记时间"], endorsements) +
    `<h3>余额快照</h3>` + table(["时间", "批单", "当前限额", "摊回容量", "已用", "剩余"], snapshots);
}
document.getElementById("loadLedger").onclick = loadLedger;
document.getElementById("contract").onchange = loadLedger;

document.getElementById("endorseForm").onsubmit = async (event) => {
  event.preventDefault();
  const id = document.getElementById("contract").value;
  const result = document.getElementById("endorseResult");
  if (!id) { result.innerHTML = `<div class="error">请先选择合约。</div>`; return; }
  const body = {
    effective_date: document.getElementById("effDate").value,
    direction: document.getElementById("direction").value,
    amount: parseFloat(document.getElementById("amount").value),
    reason: document.getElementById("reason").value,
  };
  const response = await fetch(`/api/records/${id}/endorsements`, {
    method: "POST",
    headers: {...headers, "Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) {
    const d = data.details || {};
    const gap = d.gap !== undefined ? `<p>缺口：<b>${fmt(d.gap)}</b>（已核定占用 ${fmt(d.used)}）</p>` : "";
    const occ = d.occupancy ? `<h3>占用明细</h3>` + table(["类型", "赔案号", "状态", "金额"], occupancyRows(d.occupancy)) : "";
    result.innerHTML = `<div class="error"><p><b>${esc(data.message)}</b>（合约 ${esc(d.contract || "")}）</p>${gap}${occ}</div>`;
    return;
  }
  result.innerHTML = `<div class="ok">批单已登记，当前限额 ${fmt(data.current_limit)}，已用 ${fmt(data.used)}，剩余 ${fmt(data.remaining)}。</div>`;
  loadLedger();
};

loadContracts();
</script>
</body>
</html>
